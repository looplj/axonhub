<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model catalog check</title>
  <style>
    :root {
      font-family: var(--font-sans, system-ui);
      background: var(--background, white);
      color: var(--foreground, #222);
    }
    body { margin: 0; padding: 16px; }
    dl[hidden] { display: none; }
    dl { display: grid; grid-template-columns: fit-content(65%) minmax(0, 1fr); gap: 8px 16px; }
    dd { margin: 0; overflow-wrap: anywhere; }
    button {
      padding: 8px 12px;
      border: 0;
      border-radius: 6px;
      background: var(--primary, #222);
      color: var(--primary-foreground, white);
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <p id="status" role="status"></p>
  <dl id="summary" hidden>
    <dt id="scope-label">Checked scope</dt><dd id="scope"></dd>
    <dt id="available-label">Models to import</dt><dd id="available"></dd>
    <dt id="changed-label">Models with reference price changes</dt><dd id="changed"></dd>
  </dl>
  <button id="open-models" type="button" disabled>Open model library</button>
  <script src="../_axonhub/bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
