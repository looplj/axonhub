# AxonHub Docker Compose Configuration
#
# CONFIGURATION OPTIONS:
# 1. 环境变量 - 适用于敏感配置 (如数据库DSN、密码等)，优先级高于配置文件
#    参考: https://github.com/looplj/axonhub/blob/main/docs/deployment/configuration.md#configuration-priority
#
# 2. 配置文件 - 适用于复杂配置 (如缓存、日志、监控等)
#    创建 config.yml 文件并取消 volumes 配置的注释
#    配置参考: https://github.com/looplj/axonhub/blob/main/docs/deployment/configuration.md
#
# 3. 简单部署 - 如果不需要复杂配置，可以注释掉 config 的 volumes 配置
#    仅使用环境变量进行基本配置即可运行
#
# 安全部署建议：
# - 必须设置 DB_PASSWORD，不再提供弱默认密码
# - 必须显式设置 AXONHUB_IMAGE 和 POSTGRES_IMAGE；生产环境使用不可变 digest
# - 默认只绑定到宿主机回环地址；需要公网访问时请显式设置 AXONHUB_BIND_ADDRESS

services:
  # PostgreSQL 数据库
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set (prefer an immutable digest)}
    environment:
      POSTGRES_DB: axonhub
      POSTGRES_USER: axonhub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - axonhub-backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    shm_size: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AxonHub 主服务
  axonhub:
    image: ${AXONHUB_IMAGE:?AXONHUB_IMAGE must be set (prefer an immutable digest)}
    environment:
      # 数据库配置可以通过环境变量设置，优先级高于配置文件
      AXONHUB_DB_DIALECT: postgres
      AXONHUB_DB_DSN: "postgres://axonhub:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/axonhub?sslmode=disable"
    ports:
      - "${AXONHUB_BIND_ADDRESS:-127.0.0.1}:${AXONHUB_HOST_PORT:-8090}:8090"
    volumes:
      # 配置文件挂载 - 用于复杂配置，如缓存、日志、监控等
      # 参考: https://github.com/looplj/axonhub/blob/main/docs/deployment/configuration.md
      - ./config.yml:/app/config.yml:ro
      # - axonhub_data:/data
    networks:
      - axonhub-backend
      - axonhub-egress
    depends_on:
      postgres:
        condition: service_healthy
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${AXONHUB_CPU_LIMIT:-2.0}"
          memory: ${AXONHUB_MEMORY_LIMIT:-1G}
          pids: 256
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8090/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SQLite 配置示例 (取消注释以使用 SQLite)
  # 注意: 此服务与上面的 'axonhub' 服务冲突。请只启用其中一个。
