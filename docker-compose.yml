  #         "http://localhost:8090/health",
  #       ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

  # MySQL 配置示例 (取消注释以使用 MySQL)
  # 注意: 此服务与上面的 'axonhub' 服务冲突。请只启用其中一个。
  # mysql:
  #   image: ${MYSQL_IMAGE:-mysql:8.0}
  #   container_name: axonhub-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
  #     MYSQL_DATABASE: axonhub
  #     MYSQL_USER: axonhub
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - axonhub-backend
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #
  # # AxonHub 主服务 (MySQL 版本)
  # # 注意: 取消注释此服务时，请注释掉上面的 PostgreSQL 版本 axonhub 服务
  # axonhub-mysql:
  #   image: ${AXONHUB_IMAGE:?AXONHUB_IMAGE must be set (prefer an immutable digest)}
  #   container_name: axonhub-mysql-app
  #   environment:
  #     AXONHUB_DB_DIALECT: mysql
