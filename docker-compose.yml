  #     start_period: 40s

volumes:
  postgres_data:
  mysql_data:

networks:
  # Database traffic is private to the Compose project. The app also joins
  # axonhub-egress so it can reach configured upstream AI providers.
  axonhub-backend:
    internal: true
  axonhub-egress:
    driver: bridge
