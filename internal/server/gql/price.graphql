# Enum types
enum PricingMode {
  flat_fee
  usage_per_unit
  usage_tiered
  usage_volume
}

enum PriceItemCode {
  prompt_tokens
  completion_tokens
  prompt_cached_tokens
  prompt_write_cached_tokens
}

enum PromptWriteCacheVariantCode {
  five_min
  one_hour
}

# ModelPrice represents pricing configuration for a model
type ModelPrice {
  items: [ModelPriceItem!]!
  schedule: PriceSchedule
}

type ModelPriceItem {
  itemCode: PriceItemCode!
  pricing: Pricing!
  promptWriteCacheVariants: [PromptWriteCacheVariant!]
}

# Time-based price schedule
type PriceSchedule {
  timezone: String!
  overrides: [PriceOverride!]!
}

type PriceOverride {
  name: String!
  priority: Int!
  when: OverrideWhen!
  items: [ModelPriceItem!]!
}

type OverrideWhen {
  dailyTime: DailyTimeRange
  weekdays: [Int!]
  dateRange: DateRange
}

type DailyTimeRange {
  start: String!
  end: String!
}

type DateRange {
  start: String!
  end: String!
}

type Pricing {
  mode: PricingMode!
  flatFee: Decimal
  usagePerUnit: Decimal
  usageTiered: TieredPricing
}

type TieredPricing {
  tiers: [PriceTier!]!
}

type PriceTier {
  upTo: Int
  pricePerUnit: Decimal!
}

type PromptWriteCacheVariant {
  variantCode: PromptWriteCacheVariantCode!
  pricing: Pricing!
}

# Input types for ModelPrice
input ModelPriceInput {
  items: [ModelPriceItemInput!]!
  schedule: PriceScheduleInput
}

input ModelPriceItemInput {
  itemCode: PriceItemCode!
  pricing: PricingInput!
  promptWriteCacheVariants: [PromptWriteCacheVariantInput!]
}

# Input types for time-based price schedule
input PriceScheduleInput {
  timezone: String!
  overrides: [PriceOverrideInput!]!
}

input PriceOverrideInput {
  name: String!
  priority: Int!
  when: OverrideWhenInput!
  items: [ModelPriceItemInput!]!
}

input OverrideWhenInput {
  dailyTime: DailyTimeRangeInput
  weekdays: [Int!]
  dateRange: DateRangeInput
}

input DailyTimeRangeInput {
  start: String!
  end: String!
}

input DateRangeInput {
  start: String!
  end: String!
}

input PricingInput {
  mode: PricingMode!
  flatFee: Decimal
  usagePerUnit: Decimal
  usageTiered: TieredPricingInput
}

input TieredPricingInput {
  tiers: [PriceTierInput!]!
}

input PriceTierInput {
  upTo: Int
  pricePerUnit: Decimal!
}

input PromptWriteCacheVariantInput {
  variantCode: PromptWriteCacheVariantCode!
  pricing: PricingInput!
}

input SaveChannelModelPriceInput {
  modelId: String!
  price: ModelPriceInput!
}

extend type Mutation {
  saveChannelModelPrices(channelId: ID!, input: [SaveChannelModelPriceInput!]!): [ChannelModelPrice!]!
}
