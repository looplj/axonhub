# ModelCard represents model capabilities and metadata
type ModelCard {
  reasoning: ModelCardReasoning!
  reasoningEfforts: [String!]
  toolCall: Boolean!
  temperature: Boolean!
  modalities: ModelCardModalities!
  vision: Boolean
  cost: ModelCardCost!
  limit: ModelCardLimit!
  knowledge: String
  releaseDate: String
  lastUpdated: String
}

type ModelCardReasoning {
  supported: Boolean!
  default: Boolean!
}

type ModelCardModalities {
  input: [String!]!
  output: [String!]!
}

type ModelCardCost {
  input: Float!
  output: Float!
  cacheRead: Float!
  cacheWrite: Float!
}

type ModelCardLimit {
  context: Int!
  output: Int!
}

# ModelSettings represents model Association configuration
type ModelSettings {
  disableDeveloperSettingsInheritance: Boolean!
  associations: [ModelAssociation!]!
  loadBalancerStrategy: String!
  traceStickyMode: String!
}

type ModelAssociation {
  type: String!
  priority: Int!
  disabled: Boolean!
  when: ModelAssociationWhen
  channelModel: ChannelModelAssociation
  channelRegex: ChannelRegexAssociation
  regex: RegexAssociation
  modelId: ModelIDAssociation
  channelTagsModel: ChannelTagsModelAssociation
  channelTagsRegex: ChannelTagsRegexAssociation
}

type ModelAssociationWhen {
  enabled: Boolean!
  condition: FilterCondition
}

type ChannelModelAssociation {
  channelId: Int!
  modelId: String!
}

type ChannelRegexAssociation {
  channelId: Int!
  pattern: String!
}

type RegexAssociation {
  pattern: String!
  exclude: [ExcludeAssociation!]
}

type ModelIDAssociation {
  modelId: String!
  exclude: [ExcludeAssociation!]
}

type ExcludeAssociation {
  channelNamePattern: String
  channelIds: [Int!]
  channelTags: [String!]
}

type ChannelTagsModelAssociation {
  channelTags: [String!]!
  modelId: String!
}

type ChannelTagsRegexAssociation {
  channelTags: [String!]!
  pattern: String!
}

# Input types for mutations
input ModelCardInput {
  reasoning: ModelCardReasoningInput
  reasoningEfforts: [String!]
  toolCall: Boolean
  temperature: Boolean
  modalities: ModelCardModalitiesInput
  vision: Boolean
  cost: ModelCardCostInput
  limit: ModelCardLimitInput
  knowledge: String
  releaseDate: String
  lastUpdated: String
}

input ModelCardReasoningInput {
  supported: Boolean
  default: Boolean
}

input ModelCardModalitiesInput {
  input: [String!]
  output: [String!]
}

input ModelCardCostInput {
  input: Float
  output: Float
  cacheRead: Float
  cacheWrite: Float
}

input ModelCardLimitInput {
  context: Int
  output: Int
}

input ModelSettingsInput {
  disableDeveloperSettingsInheritance: Boolean
  associations: [ModelAssociationInput!]!
  loadBalancerStrategy: String
  traceStickyMode: String
}

input ModelAssociationInput {
  type: String!
  priority: Int
  disabled: Boolean
  when: ModelAssociationWhenInput
  channelModel: ChannelModelAssociationInput
  channelRegex: ChannelRegexAssociationInput
  regex: RegexAssociationInput
  modelId: ModelIDAssociationInput
  channelTagsModel: ChannelTagsModelAssociationInput
  channelTagsRegex: ChannelTagsRegexAssociationInput
}

input ModelAssociationWhenInput {
  enabled: Boolean
  condition: FilterConditionInput
}

input ChannelModelAssociationInput {
  channelId: Int!
  modelId: String!
}

input ChannelRegexAssociationInput {
  channelId: Int!
  pattern: String!
}

input RegexAssociationInput {
  pattern: String!
  exclude: [ExcludeAssociationInput!]
}

input ModelIDAssociationInput {
  modelId: String!
  exclude: [ExcludeAssociationInput!]
}

input ExcludeAssociationInput {
  channelNamePattern: String
  channelIds: [Int!]
  channelTags: [String!]
}

input ChannelTagsModelAssociationInput {
  channelTags: [String!]!
  modelId: String!
}

input ChannelTagsRegexAssociationInput {
  channelTags: [String!]!
  pattern: String!
}

type ModelChannelConnection {
  channel: Channel!
  models: [ChannelModelEntry!]!
  priority: Int!
}

type ChannelModelEntry {
  requestModel: String!
  actualModel: String!
  source: String!
}

input ChannelModelPreviewInput {
  supportedModels: [String!]!
  settings: ChannelSettingsInput
}

type UnassociatedChannel {
  channel: Channel!
  models: [String!]!
}

extend type Model {
  editVersion: String! @goField(forceResolver: true)
  missingReferencePrices: [String!]! @goField(forceResolver: true)
  associatedChannelCount: Int! @goField(forceResolver: true)
}

extend type Query {
  """
  Preview exposed model names for unsaved channel settings without persisting changes.
  """
  previewChannelModelEntries(input: ChannelModelPreviewInput!): [ChannelModelEntry!]!
  fetchModels(input: FetchModelsInput!): FetchModelsPayload!
  queryModels(input: QueryModelsInput!): [ModelIdentityWithStatus!]!
  queryModelChannelConnections(
    associations: [ModelAssociationInput!]!
  ): [ModelChannelConnection!]!
  queryUnassociatedChannels: [UnassociatedChannel!]!
}

extend type Mutation {
  createModel(input: CreateModelInput!, editedPrices: [ManualPriceEdit!]): Model!
  bulkCreateModels(inputs: [CreateModelInput!]!): [Model!]!
  updateModel(id: ID!, input: UpdateModelInput!, editedPrices: [ManualPriceEdit!], expectedVersion: String): Model!
  deleteModel(id: ID!): Boolean!
  updateModelStatus(id: ID!, status: ModelStatus!): Boolean!
  bulkArchiveModels(ids: [ID!]!): Boolean!
  bulkDisableModels(ids: [ID!]!): Boolean!
  bulkEnableModels(ids: [ID!]!): Boolean!
  bulkDeleteModels(ids: [ID!]!): Boolean!
}

enum ReferencePriceField { input output cacheRead cacheWrite }

input ManualPriceEdit {
  field: ReferencePriceField!
  missing: Boolean!
}

input CatalogImportScope {
  channels: Boolean!
  providers: [String!]!
  ignorePrefix: Boolean!
}

type CatalogImportTier {
  label: String!
  value: Float!
}

type CatalogImportRate {
  field: ReferencePriceField!
  base: Float
  tiers: [CatalogImportTier!]!
}

type CatalogImportOffer {
  provider: String!
  modelID: String!
  name: String!
  developer: String!
  type: String!
  identity: String!
  canonical: String!
  rates: [CatalogImportRate!]!
}

type CatalogImportLocalPrice {
  field: ReferencePriceField!
  value: Float
  follow: Boolean!
  canonical: String!
  provider: String!
  modelID: String!
}

type CatalogImportMember { id: String!, identity: String! }
input CatalogImportMemberInput { id: String!, identity: String! }
type CatalogImportRoute { channelID: Int!, channelName: String!, actual: String!, requests: [String!]! }
input CatalogRouteChoice { channelID: Int!, actual: String!, request: String! }

type CatalogImportRow {
  modelID: String!
  name: String!
  members: [CatalogImportMember!]!
  routes: [CatalogImportRoute!]!
  version: String!
  mergeTarget: String!
  mergeTargetOccupied: Boolean!
  archived: Boolean!
  changed: Boolean!
  offers: [CatalogImportOffer!]!
  preferred: CatalogImportOffer
  prices: [CatalogImportLocalPrice!]!
}

type CatalogImportPreview {
  source: String!
  upstreamURL: String!
  revision: String!
  providers: [String!]!
  rows: [CatalogImportRow!]!
}

enum CatalogPriceAction { FOLLOW REBIND FIX FIX_BASE TIER }
input CatalogImportPriceInput {
  field: ReferencePriceField!
  action: CatalogPriceAction!
  expected: Float
  identity: String! = ""
  provider: String!
  modelID: String!
  tier: String
}
input CatalogImportSelection {
  manualMerge: Boolean! = false
  modelID: String!
  members: [CatalogImportMemberInput!]!
  routes: [CatalogRouteChoice!]!
  version: String!
  identity: String!
  name: String!
  developer: String!
  provider: String!
  sourceModelID: String!
  type: String!
  prices: [CatalogImportPriceInput!]!
}
enum CatalogImportStatus { applied invalid conflict catalogChanged failed }
type CatalogImportOutcome {
  modelID: String!
  status: CatalogImportStatus!
}
extend type Query {
  catalogImportPreview(scope: CatalogImportScope!): CatalogImportPreview!
}
extend type Mutation {
  applyCatalogImport(scope: CatalogImportScope!, revision: String!, selections: [CatalogImportSelection!]!): [CatalogImportOutcome!]!
}
