type TierCost {
  upTo: Int
  units: Int!
  subtotal: Decimal!
}

"""
A monetary amount in a specific currency. Amounts in different currencies are
never summed together.
"""
type CurrencyAmount {
  currencyCode: String!
  amount: Float!
}

type CostItem {
  itemCode: PriceItemCode!
  quantity: Int!
  tierBreakdown: [TierCost!]
  subtotal: Decimal!
}

input TierCostInput {
  upTo: Int
  units: Int!
  subtotal: Decimal!
}

input CostItemInput {
  itemCode: PriceItemCode!
  quantity: Int!
  tierBreakdown: [TierCostInput!]
  subtotal: Decimal!
}
