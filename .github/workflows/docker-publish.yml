# Publish Docker image
# Enhanced with unstable branch support and security scanning

name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'unstable'
  pull_request:
    branches:
      - 'unstable'

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    if: github.event_name != 'pull_request'
    
    permissions:
      contents: read
      packages: write
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve version & write VERSION
        run: |
          git fetch --tags --force --depth=1
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=$TAG
          elif [[ "${{ github.ref }}" == refs/heads/unstable ]]; then
            VERSION="unstable-$(git rev-parse --short HEAD)"
            TAG="unstable"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
            TAG="dev"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "$VERSION" > internal/build/VERSION
          echo "Building version: $VERSION (tag: $TAG) for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/axonhub

      - name: Build & push single-arch
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/axonhub:${{ env.TAG }}-${{ matrix.arch }}
            ${{ github.ref == 'refs/heads/unstable' && format('ghcr.io/{0}/axonhub:unstable-{1}-{2}', github.repository_owner, github.sha, matrix.arch) || format('ghcr.io/{0}/axonhub:latest-{1}', github.repository_owner, matrix.arch) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/axonhub:${{ env.TAG }}-${{ matrix.arch }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.arch }}.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results-${{ matrix.arch }}.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results-${{ matrix.arch }}.sarif'

  create_manifests:
    name: Create multi-arch manifests (Docker Hub)
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/unstable'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Extract tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG=unstable" >> $GITHUB_ENV
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (version tag)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/axonhub:${TAG} \
            ghcr.io/${{ github.repository_owner }}/axonhub:${TAG}-amd64 \
            ghcr.io/${{ github.repository_owner }}/axonhub:${TAG}-arm64

      - name: Create & push manifest (latest/unstable)
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/unstable" ]]; then
            docker buildx imagetools create \
              -t ghcr.io/${{ github.repository_owner }}/axonhub:unstable \
              ghcr.io/${{ github.repository_owner }}/axonhub:unstable-${GITHUB_SHA}-amd64 \
              ghcr.io/${{ github.repository_owner }}/axonhub:unstable-${GITHUB_SHA}-arm64
          else
            docker buildx imagetools create \
              -t ghcr.io/${{ github.repository_owner }}/axonhub:latest \
              ghcr.io/${{ github.repository_owner }}/axonhub:latest-amd64 \
              ghcr.io/${{ github.repository_owner }}/axonhub:latest-arm64
          fi
# {{END_MODIFICATIONS}}
