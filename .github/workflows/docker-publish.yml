# Build and publish the fork's Docker image.
#
# This workflow is triggered ONLY by a push to the `dev` branch (or manually via
# workflow_dispatch). The daily `sync-upstream.yml` only writes to `unstable`,
# so mirroring upstream never publishes an image — you get a full review window
# to merge upstream, resolve conflicts and approve the code before pushing `dev`.
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   Variable DOCKER_USERNAME   Docker Hub username (image is <user>/axonhub-dev)
#   Secret   DOCKER_PASSWORD   Docker Hub access token with Read & Write scope
#
# The image is always built (so a broken build fails CI). Login and push to
# Docker Hub happen only when DOCKER_PASSWORD is configured, so the workflow
# stays green until Docker Hub is set up and starts publishing automatically the
# moment the secret is added.
name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# Never run two publishes for the same branch at once; a newer push supersedes
# an in-flight build.
concurrency:
  group: docker-publish-dev
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The secrets context is not available in step-level `if`, so the
      # presence check is materialized here where secrets ARE available.
      PUBLISH_IMAGE: ${{ secrets.DOCKER_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Stamp VERSION
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "dev-${SHA}" > internal/build/VERSION
          echo "Building dev-${SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image name
        id: image
        run: |
          USERNAME="${{ vars.DOCKER_USERNAME }}"
          if [ -z "$USERNAME" ]; then
            USERNAME="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          fi
          echo "name=${USERNAME}/axonhub-dev" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=dev-
            type=raw,value=latest

      - name: Log in to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          load: ${{ env.PUBLISH_IMAGE != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
