# Build and publish the fork's Docker image.
#
# This workflow is triggered ONLY by a push to the `dev` branch (or manually via
# workflow_dispatch). The daily `sync-upstream.yml` only writes to `unstable`,
# so mirroring upstream never publishes an image — you get a full review window
# to merge upstream, resolve conflicts and approve the code before pushing `dev`.
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   Secret   DOCKER_PASSWORD   Docker Hub access token with Read & Write scope
#   Variable DOCKER_USERNAME   Docker Hub username (image is <user>/axonhub-dev)
name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# Never run two publishes for the same branch at once; a newer push supersedes
# an in-flight build.
concurrency:
  group: docker-publish-dev
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Stamp VERSION
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "dev-${SHA}" > internal/build/VERSION
          echo "Building dev-${SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_USERNAME }}/axonhub-dev
          tags: |
            type=sha,prefix=dev-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
