# Publish Docker image
# Copy from new-api 
# https://github.com/QuantumNous/new-api/blob/main/.github/workflows/docker-image-arm64.yml
# The native-architecture build matrix is delegated to the shared reusable
# workflow docker-build.yml (mode: release).

name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

jobs:
  build_single_arch:
    name: Build & push (release)
    uses: ./.github/workflows/docker-build.yml
    with:
      mode: release
      ref: ${{ github.sha }}
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  create_manifests:
    name: Create multi-arch manifests (Docker Hub)
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Extract tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (Docker Hub - version)
        run: |
          docker buildx imagetools create \
            -t looplj/axonhub:${TAG} \
            looplj/axonhub:${TAG}-amd64 \
            looplj/axonhub:${TAG}-arm64

      - name: Create & push manifest (Docker Hub - latest)
        run: |
          docker buildx imagetools create \
            -t looplj/axonhub:latest \
            looplj/axonhub:latest-amd64 \
            looplj/axonhub:latest-arm64
