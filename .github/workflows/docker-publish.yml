# Build and publish the fork's Docker image.
#
# This workflow is triggered ONLY by a push to the `dev` branch (or manually via
# workflow_dispatch). The daily `sync-upstream.yml` only writes to `unstable`,
# so mirroring upstream never publishes an image — you get a full review window
# to merge upstream, resolve conflicts and approve the code before pushing `dev`.
#
# The image is published to two registries:
#   - GitHub Container Registry (ghcr.io/<owner>/<repo>) — this is what shows up
#     in the repository's Packages sidebar. It is pushed with the built-in
#     GITHUB_TOKEN, so it needs no extra secrets.
#   - Docker Hub (<user>/axonhub-dev) — pushed only when DOCKER_PASSWORD is set.
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   Variable DOCKER_USERNAME   Docker Hub username (image is <user>/axonhub-dev)
#   Secret   DOCKER_PASSWORD   Docker Hub access token with Read & Write scope
#
# The image is always built (so a broken build fails CI). GitHub Container
# Registry always receives the image; the Docker Hub image is optional, so CI
# stays green even before Docker Hub is configured.
name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# Never run two publishes for the same branch at once; a newer push supersedes
# an in-flight build.
concurrency:
  group: docker-publish-dev
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push the image to GitHub Container Registry.
      packages: write
    env:
      # The secrets context is not available in step-level `if`, so the
      # presence check is materialized here where secrets ARE available.
      PUBLISH_DOCKERHUB: ${{ secrets.DOCKER_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Stamp VERSION
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "dev-${SHA}" > internal/build/VERSION
          echo "Building dev-${SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image names
        id: image
        run: |
          # ghcr image name matches the repository, so GitHub links the package
          # to this repo and shows it in the sidebar.
          GHCR="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          DOCKERHUB_OWNER="${{ vars.DOCKER_USERNAME }}"
          if [ -z "$DOCKERHUB_OWNER" ]; then
            DOCKERHUB_OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          fi
          DOCKERHUB="${DOCKERHUB_OWNER}/axonhub-dev"

          if [ "${PUBLISH_DOCKERHUB}" = "true" ]; then
            # ghcr.io is always published; Docker Hub only when configured.
            # A multi-image value needs the heredoc delimiter form for GITHUB_OUTPUT.
            {
              echo 'images<<__IMAGES_EOF__'
              echo "$GHCR"
              echo "$DOCKERHUB"
              echo '__IMAGES_EOF__'
            } >> "$GITHUB_OUTPUT"
          else
            echo "images=${GHCR}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.images }}
          tags: |
            type=sha,prefix=dev-
            type=raw,value=latest
            type=raw,value=cn,enable=true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUBLISH_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
