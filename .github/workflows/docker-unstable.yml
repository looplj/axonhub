name: Publish Docker image (unstable)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  prepare:
    name: Pin commit & date
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.pin.outputs.commit_sha }}
      build_date: ${{ steps.pin.outputs.build_date }}
      base_version: ${{ steps.pin.outputs.base_version }}
    steps:
      - name: Check out unstable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: unstable
          fetch-depth: 1
          persist-credentials: false

      - name: Pin commit SHA & date
        id: pin
        run: |
          git fetch --tags --force --depth=1
          BASE_VERSION=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(cat internal/build/VERSION 2>/dev/null || true)
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=v0.0.0
          fi
          if ! printf '%s\n' "$BASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Invalid base version: $BASE_VERSION" >&2
            exit 1
          fi
          printf 'commit_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'build_date=%s\n' "$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          printf 'base_version=%s\n' "$BASE_VERSION" >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: Build & push (unstable)
    needs: [prepare]
    uses: ./.github/workflows/docker-build.yml
    with:
      mode: unstable
      ref: ${{ needs.prepare.outputs.commit_sha }}
      base_version: ${{ needs.prepare.outputs.base_version }}
      build_date: ${{ needs.prepare.outputs.build_date }}
    permissions:
      contents: read
      packages: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  create_manifests:
    name: Create multi-arch manifest (Docker Hub)
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (Docker Hub - unstable)
        run: |
          DATE=${{ needs.prepare.outputs.build_date }}
          docker buildx imagetools create \
            -t looplj/axonhub:unstable \
            looplj/axonhub:unstable-amd64 \
            looplj/axonhub:unstable-arm64
          docker buildx imagetools create \
            -t looplj/axonhub:unstable-${DATE} \
            looplj/axonhub:unstable-${DATE}-amd64 \
            looplj/axonhub:unstable-${DATE}-arm64
