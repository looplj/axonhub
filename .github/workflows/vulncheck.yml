name: Govulncheck
on:
  push:
    branches:
      - 'unstable'
      - 'release/**'
  pull_request:
    branches:
      - 'unstable'
      - 'release/**'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO111MODULE: on

concurrency:
  group: govulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Govulncheck (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: |
            go.sum
            llm/go.sum

      - name: govulncheck
        run: go tool govulncheck ./...

  govulncheck-llm:
    name: Govulncheck (llm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: |
            go.sum
            llm/go.sum

      - name: govulncheck
        working-directory: llm
        run: go tool govulncheck ./...
